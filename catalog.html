<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="公司短剧资产库与播放热度榜单" />
  <title>公司短剧资产库</title>
  <style>
    :root{--ink:#151722;--muted:#74798a;--bg:#f4f5f9;--surface:#fff;--line:#e5e7ef;--purple:#6257ff;--purple-dark:#453cda;--purple-soft:#eeecff;--nav:#191b26;--green:#169267;--shadow:0 16px 50px rgba(23,25,38,.08)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}.shell{max-width:1480px;margin:auto;padding:0 26px 50px}.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none}.brand-mark{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:var(--purple);color:#fff;font-weight:900}.brand strong{display:block;font-size:15px}.brand small{color:var(--muted);font-size:11px}.nav{display:flex;align-items:center;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;min-height:36px;text-decoration:none;font-size:12px;font-weight:700}.btn:hover{border-color:#c6c8d5}.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
    .hero{background:var(--nav);color:#fff;border-radius:18px;padding:38px 40px 34px;overflow:hidden;position:relative;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:330px;height:330px;border:70px solid rgba(98,87,255,.23);border-radius:50%;right:-120px;top:-210px}.eyebrow{font-size:11px;letter-spacing:1.8px;color:#a9a6ff;font-weight:800;text-transform:uppercase}.hero h1{font-size:36px;margin:11px 0 12px;letter-spacing:-1px}.hero p{max-width:660px;color:#b6bac9;line-height:1.8;font-size:13px;margin:0}.hero-stats{display:flex;gap:32px;margin-top:28px;position:relative;z-index:2}.hero-stat strong{display:block;font-size:24px}.hero-stat span{color:#9499ad;font-size:11px}.updated{position:absolute;right:38px;bottom:35px;color:#8e93a7;font-size:11px;z-index:2}
    .section{margin-top:24px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:13px}.section-head h2{font-size:18px;margin:0 0 4px}.section-head p{font-size:11px;color:var(--muted);margin:0}.ranking{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.rank-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;min-height:146px;position:relative;overflow:hidden}.rank-card:first-child{background:linear-gradient(135deg,#282b3b,#191b26);color:#fff;border-color:#282b3b}.rank-number{position:absolute;right:15px;top:6px;font-size:64px;font-weight:900;color:#f0eff8;line-height:1}.rank-card:first-child .rank-number{color:#383b51}.rank-label{color:var(--purple);font-size:10px;font-weight:800;letter-spacing:.8px}.rank-card:first-child .rank-label{color:#9d98ff}.rank-title{font-size:16px;font-weight:800;margin-top:14px;max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-en{color:var(--muted);font-size:10.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}.rank-card:first-child .rank-en{color:#969bad}.rank-bottom{display:flex;align-items:end;justify-content:space-between;margin-top:18px}.rank-views{font-size:18px;font-weight:850}.rank-source{font-size:10px;color:var(--muted)}
    .toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:13px}.field{border:1px solid #d9dbe5;border-radius:9px;min-height:38px;padding:9px 11px;background:#fff;font-size:12px}.field:focus{outline:0;border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-soft)}.search{min-width:290px;flex:1}.result-count{font-size:11px;color:var(--muted);margin-left:auto}.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.drama{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:300px;transition:.15s}.drama:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.drama-top{padding:18px 18px 15px;border-bottom:1px solid var(--line);position:relative}.drama-rank{position:absolute;right:16px;top:16px;background:var(--purple-soft);color:var(--purple-dark);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.drama h3{margin:0 55px 5px 0;font-size:16px}.drama .english{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drama-body{padding:15px 18px;display:grid;gap:12px;flex:1}.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta{font-size:10px;color:var(--muted)}.meta strong{display:block;color:var(--ink);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.accounts{display:flex;gap:5px;flex-wrap:wrap}.tag{display:inline-flex;background:#f4f4f8;color:#595d6f;border-radius:999px;padding:4px 8px;font-size:10px}.drama-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.views strong{font-size:17px}.views span{display:block;font-size:9px;color:var(--muted);margin-top:2px}.detail-btn{border:0;background:transparent;color:var(--purple-dark);font-size:11px;font-weight:800;padding:8px}
    .empty{grid-column:1/-1;background:#fff;border:1px dashed #cfd1dc;border-radius:14px;padding:70px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:8px}.loading{opacity:.6;pointer-events:none}dialog{border:0;border-radius:16px;padding:0;width:min(780px,calc(100vw - 28px));box-shadow:0 28px 100px rgba(20,22,32,.28)}dialog::backdrop{background:rgba(18,20,29,.58);backdrop-filter:blur(3px)}.modal-head{padding:21px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.modal-head h3{margin:0 0 5px}.modal-head p{margin:0;color:var(--muted);font-size:11px}.close{border:0;background:#f2f2f7;width:32px;height:32px;border-radius:9px;font-size:20px}.modal-body{padding:20px 22px;max-height:70vh;overflow:auto}.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}.detail-stat{padding:13px;background:#f7f7fa;border-radius:10px}.detail-stat strong{display:block;font-size:17px}.detail-stat span{font-size:10px;color:var(--muted)}.source-list{display:grid;gap:8px}.source-row{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}.source-row strong{font-size:12px}.source-row small{display:block;color:var(--muted);margin-top:3px}.source-link{color:var(--purple-dark);font-size:11px;text-decoration:none;font-weight:700}.footer{padding:30px 0 0;color:#999dac;font-size:10px;text-align:center}
    @media(max-width:1000px){.catalog-grid{grid-template-columns:repeat(2,1fr)}.ranking{grid-template-columns:1fr 1fr}.ranking .rank-card:nth-child(3){display:none}.updated{position:static;margin-top:20px}}
    @media(max-width:680px){.shell{padding:0 14px 35px}.topbar{height:66px}.nav .btn:first-child{display:none}.hero{padding:28px 22px}.hero h1{font-size:27px}.hero-stats{gap:18px}.hero-stat strong{font-size:19px}.ranking,.catalog-grid{grid-template-columns:1fr}.ranking .rank-card:nth-child(3){display:block}.search{min-width:100%}.result-count{width:100%;margin:0}.people{grid-template-columns:1fr}.detail-stats{grid-template-columns:1fr}.source-row{grid-template-columns:1fr auto}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/catalog"><span class="brand-mark">T</span><span><strong>公司短剧资产库</strong><small>Company Drama Catalog</small></span></a>
      <nav class="nav"><a class="btn" href="/">运营数据看板</a><a class="btn primary" href="/admin">管理后台</a></nav>
    </header>

    <section class="hero">
      <div class="eyebrow">Company-Owned Drama Collection</div>
      <h1>公司自有短剧 · 统一资产视图</h1>
      <p>同一部短剧在不同 TikTok 账号发布时，将在这里合并统计。剧名、主创和归属信息均由运营后台确认后公开。</p>
      <div class="hero-stats">
        <div class="hero-stat"><strong id="heroCount">—</strong><span>已上架短剧</span></div>
        <div class="hero-stat"><strong id="heroViews">—</strong><span>累计播放</span></div>
        <div class="hero-stat"><strong id="heroAccounts">—</strong><span>覆盖发布账号</span></div>
      </div>
      <div class="updated" id="updatedText">正在同步最新资料…</div>
    </section>

    <section class="section">
      <div class="section-head"><div><h2>播放热度榜</h2><p>按各发布账号当前累计播放合并计算</p></div></div>
      <div class="ranking" id="ranking"></div>
    </section>

    <section class="section">
      <div class="section-head"><div><h2>全部公司短剧</h2><p>搜索剧名、主创或发布账号</p></div></div>
      <div class="toolbar"><input class="field search" id="search" placeholder="输入中文/英文剧名、编剧、制作或 TikTok 账号" />
        <select class="field" id="sort"><option value="manual">按运营顺序</option><option value="views">按播放量</option><option value="latest">按最近发布</option><option value="title">按剧名</option></select>
        <button class="btn" id="resetBtn">清除筛选</button><span class="result-count" id="resultCount">—</span></div>
      <div class="catalog-grid loading" id="catalogGrid"><div class="empty"><strong>正在读取公司短剧资料</strong>请稍候</div></div>
    </section>
    <footer class="footer">数据来自 TikHub 抓取结果；公司归属与主创资料由运营后台人工确认。</footer>
  </div>

  <dialog id="detailDialog">
    <div class="modal-head"><div><h3 id="detailTitle">短剧详情</h3><p id="detailEnglish"></p></div><button class="close" id="closeDialog" aria-label="关闭">×</button></div>
    <div class="modal-body"><div class="detail-stats" id="detailStats"></div><div class="people" id="detailPeople"></div><h4 style="margin:22px 0 10px">发布来源</h4><div class="source-list" id="detailSources"></div></div>
  </dialog>
  <script src="/catalog.js?v=20260714-1"></script>
</body>
</html>
